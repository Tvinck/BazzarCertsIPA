name: Build BAZZAR Panel
on:
  workflow_dispatch:
  push:
    paths:
      - 'BAZZARPanel.*'
      - 'YMNightAdapter.m'
      - 'build-macos.sh'
      - '.github/workflows/build-ios.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Record build environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Build library
        run: bash build-macos.sh
      - name: Inspect result
        run: |
          set -euo pipefail
          plutil -lint dist/BAZZARPanel.plist
          xcrun lipo dist/BAZZARPanel.dylib -verify_arch arm64
          xcrun lipo dist/BAZZARPanel-YMNight.dylib -verify_arch arm64
          xcrun otool -L dist/BAZZARPanel.dylib > dist/dependencies.txt
          xcrun otool -l dist/BAZZARPanel.dylib > dist/load-commands.txt
          xcrun otool -L dist/BAZZARPanel-YMNight.dylib > dist/adapter-dependencies.txt
          xcrun otool -l dist/BAZZARPanel-YMNight.dylib > dist/adapter-load-commands.txt
          xcrun nm -u dist/BAZZARPanel-YMNight.dylib > dist/adapter-imports.txt
          xcrun nm -gU dist/BAZZARPanel.dylib > dist/exports.txt
          grep -q _BAZZARPresentPanel dist/exports.txt
          git rev-parse HEAD > dist/source-commit.txt
          xcodebuild -version > dist/build-environment.txt
          xcrun --sdk iphoneos --show-sdk-version >> dist/build-environment.txt
          cd dist
          shasum -a 256 BAZZARPanel.dylib BAZZARPanel-YMNight.dylib BAZZARPanel.plist > SHA256SUMS.txt
      - name: Upload library and checks
        uses: actions/upload-artifact@v4
        with:
          name: BAZZARPanel-ios-arm64-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
